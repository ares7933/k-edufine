<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>공문 초안 작성기</title>
<style>
:root{--bg:#f3f4f6;--panel:#ffffff;--text:#1d2129;--muted:#5d6570;--line:#d8dce2;--accent:#2457c5;--accent-ink:#fff;--accent-weak:#e8eefb;--warn:#8a4b00;--warn-bg:#fff3dd;--ok:#17703f;--ok-bg:#e5f5ec;--input:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141619;--panel:#1d2024;--text:#e6e8eb;--muted:#9aa2ad;--line:#343940;--accent:#6f9bff;--accent-ink:#0d1220;--accent-weak:#22304d;--warn:#ffc46b;--warn-bg:#3a2c12;--ok:#7fd8a4;--ok-bg:#163223;--input:#15181b}}
:root[data-theme="dark"]{--bg:#141619;--panel:#1d2024;--text:#e6e8eb;--muted:#9aa2ad;--line:#343940;--accent:#6f9bff;--accent-ink:#0d1220;--accent-weak:#22304d;--warn:#ffc46b;--warn-bg:#3a2c12;--ok:#7fd8a4;--ok-bg:#163223;--input:#15181b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header.top h1{font-size:17px;margin:0;font-weight:700}
header.top .sub{color:var(--muted);font-size:12.5px}
.actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
main{display:grid;grid-template-columns:minmax(340px,460px) 1fr;gap:16px;padding:16px;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}
.form{display:flex;flex-direction:column;gap:12px;min-width:0}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 14px}
details[open]{padding-bottom:14px}
summary{cursor:pointer;font-weight:700;padding:11px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--muted)}
details[open] summary::before{content:"▾ "}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
label b{color:var(--text);font-weight:600}
input[type=text],select,textarea{width:100%;font:inherit;color:var(--text);background:var(--input);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
textarea{resize:vertical;min-height:70px;font-family:ui-monospace,"D2Coding","GulimChe","굴림체",Consolas,monospace;font-size:13px;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--text);margin:8px 0 0}
.radios{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.radios label{display:flex;gap:4px;align-items:center;margin:0;color:var(--text)}
.checks{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.checks h3{margin:2px 0 6px;font-size:13.5px}
.checks ul{margin:0;padding-left:18px}
.checks li{margin:2px 0;font-size:13px}
.fix{color:var(--ok)}
.warn{color:var(--warn)}
.pill{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:99px;margin-left:4px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.w{background:var(--warn-bg);color:var(--warn)}
.previewWrap{position:sticky;top:70px;min-width:0}
.previewBox{background:#8a8f98;border-radius:10px;padding:16px;overflow:hidden}
#scaler{transform-origin:top left}
.paper{background:#fff;color:#000;width:210mm;min-height:297mm;padding:30mm 15mm 15mm 20mm;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.logoIn{display:flex;gap:8px;align-items:center;font-size:12.5px}
.logoIn input{font-size:12px;max-width:100%}
@media print{
  @page{size:A4;margin:30mm 15mm 15mm 20mm}
  body{background:#fff}
  header.top,.form,.checks{display:none!important}
  main{display:block;padding:0}
  .previewWrap{position:static}
  .previewBox{background:none;padding:0;height:auto!important}
  #scaler{transform:none!important}
  .paper{box-shadow:none;width:auto;min-height:0;padding:0}
}
</style>
</head>
<body>
<header class="top">
  <div><h1>공문 초안 작성기</h1><div class="sub">제목과 내용을 넣으면 에듀파인 서식에 맞춘 공문 초안을 만듭니다 · v1.1 (2026. 11. 9.)</div></div>
  <div class="actions">
    <button class="primary" id="btnOdt" title="한글·LibreOffice에서 열 수 있는 ODT 파일">ODT 내려받기</button>
    <button id="btnCopyRich" title="서식을 유지하여 복사 (에듀파인·한글에 붙여넣기)">서식 복사</button>
    <button id="btnCopyText" title="띄어쓰기 들여쓰기로 맞춘 텍스트">텍스트 복사</button>
    <button id="btnPrint">인쇄·PDF</button>
    <button id="btnSample">예시</button>
    <button id="btnNew">새로 쓰기</button>
  </div>
</header>
<main>
<section class="form">
  <details open>
    <summary>1. 문서 내용</summary>
    <label><b>문서 유형</b> — 고르면 2번 문장과 항목 틀을 채워 줍니다</label>
    <select id="docType">
      <option value="plan">추진 계획(안) (내부결재)</option>
      <option value="committee">위원회·조직 구성 (내부결재)</option>
      <option value="result">결과 보고 (내부결재 / 교육청 제출)</option>
      <option value="meetingPlan">회의 개최 (계획·안내)</option>
      <option value="meeting">회의 결과 보고 (내부결재 / 교육청 제출)</option>
      <option value="pay">수당·강사비 지급 품의 (내부결재)</option>
      <option value="submit">교육청에 자료 제출</option>
      <option value="notice">안내·협조 요청</option>
      <option value="free">직접 작성 (자동 문장 없음)</option>
    </select>
    <label><b>제목</b></label>
    <input type="text" id="title" placeholder="예: 2026학년도 학교폭력 예방교육 실시 계획(안)">
    <label><b>관련</b> — 한 줄에 하나 (비우면 생략)</label>
    <textarea id="related" rows="2" placeholder="2026학년도 학교교육계획&#10;서울특별시교육청 중등교육과-1234(2026. 3. 5.)"></textarea>
    <div id="closingWrap">
      <label><b>맺음말</b></label>
      <select id="closing">
        <option>협조하여 주시기 바랍니다.</option>
        <option>업무에 참고하시기 바랍니다.</option>
        <option>기한 내 제출하여 주시기 바랍니다.</option>
        <option>안내하여 주시기 바랍니다.</option>
      </select>
    </div>
    <label><b>2번 문장</b> — 비우면 유형에 맞춰 자동으로 만듭니다</label>
    <input type="text" id="lead" placeholder="(자동)">
    <div class="hint" id="leadAuto"></div>
    <label><b>세부 내용</b> — 한 줄에 한 항목. 앞에 공백 2칸(또는 Tab)마다 한 단계 아래로. 번호는 자동</label>
    <textarea id="body" rows="9" placeholder="일시: 2026. 3. 20. 오후 2시~3시&#10;장소 : 시청각실&#10;대상: 1학년 전체&#10;내용&#10;  학교폭력 개념 이해&#10;  신고 방법 안내&#10;- 세부 일정은 붙임 참고&#10;| 구분 | 시간 | 내용 |&#10;| 1부 | 14:00~14:30 | 강의 |"></textarea>
    <div id="scaffoldWrap" style="display:none;margin-top:6px"><select id="scaffoldSel" style="width:auto;margin-right:4px"></select><button type="button" id="btnScaffold">자주 쓰는 항목 넣기</button> <span class="hint" id="scaffoldHint"></span></div>
    <div class="hint">‘-’, ‘※’, ‘○’로 시작하면 보조 줄, ‘|’로 시작하는 줄이 이어지면 표(첫 줄이 머리행)가 됩니다.</div>
    <label><b>안내 박스</b> (붙임 바로 위, 회색 상자)</label>
    <input type="text" id="box" list="boxList" placeholder="비우면 없음">
    <datalist id="boxList">
      <option value="※ 학교 및 교육(지원)청에서는 본 공문을 전체 교원에게 공람하여 주시기 바랍니다.">
      <option value="※ 대상자가 없는 학교에서는 관련 업무에 참고하시기 바랍니다.">
      <option value="※ 교육지원청에서는 관련 업무에 참고하시기 바랍니다.">
    </datalist>
    <label><b>붙임</b> — 한 줄에 하나. ‘1부.’는 자동으로 붙습니다</label>
    <textarea id="attach" rows="3" placeholder="학교폭력 예방교육 운영 계획&#10;(서식)참석자 명단"></textarea>
  </details>

  <details>
    <summary>2. 수신·두문 (학교 정보)</summary>
    <label><b>수신</b></label>
    <div class="radios">
      <label><input type="radio" name="recvType" value="internal" checked> 내부결재</label>
      <label><input type="radio" name="recvType" value="single"> 단일 수신</label>
      <label><input type="radio" name="recvType" value="ref"> 수신자 참조</label>
    </div>
    <div id="recvSingleWrap"><label>수신 기관 (직위로)</label><input type="text" id="recv" placeholder="서울특별시교육감(중등교육과장)"></div>
    <div id="recvListWrap"><label>수신자 목록 (결문에 표시)</label><input type="text" id="recvList" placeholder="공립고(1-125), 사립고(1-100)"></div>
    <label><b>발신명의</b> — 내부결재면 자동으로 비웁니다</label><input type="text" id="sender" value="○○고등학교장">
    <label>(경유)</label><input type="text" id="via" placeholder="없으면 비움">
    <label><b>기관명</b></label><input type="text" id="org" value="○○고등학교">
    <label>슬로건 (맨 위)</label><input type="text" id="slogan" value="미래를 여는 협력교육">
    <label>로고 이미지 (선택)</label>
    <div class="logoIn">왼쪽 <input type="file" id="logoL" accept="image/*"></div>
    <div class="logoIn" style="margin-top:4px">오른쪽 <input type="file" id="logoR" accept="image/*"></div>
    <div class="hint"><a href="#" id="logoClear">로고 지우기</a> · 로고는 화면·인쇄·서식 복사에 쓰이고 ODT에도 들어갑니다.</div>
  </details>


  <details>
    <summary>3. 자동 처리 설정</summary>
    <label class="chk"><input type="checkbox" id="optWeek" checked> 날짜에 요일 자동 붙이기 (예: 2026. 3. 4.(수))</label>
    <label class="chk"><input type="checkbox" id="optSingle" checked> 같은 단계 항목이 하나뿐이면 번호 생략</label>
    <label class="chk"><input type="checkbox" id="optFix" checked> 날짜·시간·물결표·쌍점·금액 표기 자동 고침</label>
    <div class="hint">입력한 내용과 학교·기안자 정보는 이 브라우저에만 저장됩니다.</div>
  </details>

  <div class="checks" id="checks"></div>
</section>

<section class="previewWrap">
  <div class="previewBox" id="previewBox"><div id="scaler"><div class="paper" id="paper"></div></div></div>
</section>
</main>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const FIELDS=["docType","title","related","closing","lead","body","box","attach","recv","recvList","via","org","slogan","sender"];
const CHECKS=["optWeek","optSingle","optFix"];
const KEY="gongmun-draft-v1";
let logos={L:"",R:""};

/* ---------- 한글 처리 도우미 ---------- */
const HAN="가나다라마바사아자차카타파하";
const HAN2="거너더러머버서어저처커터퍼허";
function hanLabel(n){n=n-1;if(n<14)return HAN[n];if(n<28)return HAN2[n-14];return String(n+1);}
const CIRC="①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳";
const CIRCH="㉮㉯㉰㉱㉲㉳㉴㉵㉶㉷㉸㉹㉺㉻";
function marker(level,n){
  switch(level){
    case 1:return n+".";case 2:return hanLabel(n)+".";case 3:return n+")";case 4:return hanLabel(n)+")";
    case 5:return "("+n+")";case 6:return "("+hanLabel(n)+")";case 7:return CIRC[n-1]||"("+n+")";
    default:return CIRCH[n-1]||"("+hanLabel(n)+")";
  }
}
function hasBatchim(word){
  for(let i=word.length-1;i>=0;i--){
    const c=word.charCodeAt(i);
    if(c>=0xAC00&&c<=0xD7A3)return (c-0xAC00)%28!==0;
    const ch=word[i];
    if(/\d/.test(ch))return "013678".includes(ch);
    if(/[A-Za-z]/.test(ch))return null;
  }
  return null;
}
function obj(w){const b=hasBatchim(w);return w+(b===null?"을(를)":b?"을":"를");}
// 글자 폭(굴림체 기준, em): 반각 0.5, 전각 1
function wEm(s){let w=0;for(const ch of s){w+=/[\x20-\x7e]/.test(ch)?0.5:1;}return w;}
const DOW="일월화수목금토";
function dow(y,m,d){const dt=new Date(y,m-1,d);if(dt.getFullYear()!=y||dt.getMonth()!=m-1||dt.getDate()!=d)return "";return DOW[dt.getDay()];}
function korAmount(num){
  const digits="영일이삼사오육칠팔구",small=["","십","백","천"],big=["","만","억","조"];
  if(num===0)return "영";
  let s="",g=0;
  while(num>0){
    const part=num%10000;num=Math.floor(num/10000);
    if(part){let p="";const ds=String(part).padStart(4,"0");
      for(let i=0;i<4;i++){const d=+ds[i];if(d)p+=digits[d]+small[3-i];}
      s=p+big[g]+s;}
    g++;
  }
  return s;
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ---------- 표기 자동 고침 ---------- */
function makeFixer(opts){
  const log={};
  const add=(k)=>{log[k]=(log[k]||0)+1;};
  function fix(s,ctx){
    if(!opts.fix)return s;
    let o=s;
    // 물결표
    o=o.replace(/[∼～〜]/g,"~");
    o=o.replace(/[ \t]*~[ \t]*/g,m=>{if(m!=="~")add("물결표(~) 앞뒤 붙여쓰기");return "~";});
    // 날짜 (연월일)
    let lastY=null;
    o=o.replace(/(?<![\d.])((?:19|20)\d{2})\s*(?:년|\.|-|\/)\s*(\d{1,2})\s*(?:월|\.|-|\/)\s*(\d{1,2})(?!\d)(일|\s*\.)?(\s*(?:\(\s*([월화수목금토일])(?:요일)?\s*\)|([월화수목금토일])요일))?/g,
      (m,y,mo,d,tail,dw,dwc,dwc2,offset,str)=>{dwc=dwc||dwc2;
        mo=+mo;d=+d;if(mo<1||mo>12||d<1||d>31)return m;
        lastY=+y;
        let r=y+". "+mo+". "+d+".";
        const before=str.slice(Math.max(0,offset-1),offset);
        const after=str.slice(offset+m.length,offset+m.length+1);
        const w=dow(+y,mo,d);
        if(dw){r+="("+(w||dwc)+")";}
        else if(opts.week&&ctx==="body"&&before!=="("&&after!==")"&&after!=="자"&&after!=="부"&&w&&!inParen(str,offset)&&!/^\s*(일부|전부)?개정|^\s*제정|^\s*시행/.test(str.slice(offset+m.length))){r+="("+w+")";add("요일 자동 추가");}
        if(r!==m)add("날짜 형식 (예: 2026. 3. 4.)");
        return r;
      });
    // 범위 뒤 월·일 (~3. 11.)
    o=o.replace(/~(\d{1,2})\s*(?:월|\.)\s*(\d{1,2})(?!\d)(일|\s*\.)?(\s*(?:\(\s*([월화수목금토일])(?:요일)?\s*\)|([월화수목금토일])요일))?/g,
      (m,mo,d,tail,dw,dwc,dwc2,offset,str)=>{dwc=dwc||dwc2;
        mo=+mo;d=+d;if(mo<1||mo>12||d<1||d>31)return m;
        if(!tail&&!dw&&!/월/.test(m))return m;
        let r="~"+mo+". "+d+".";
        const y=lastY||(()=>{const mm=str.slice(0,offset).match(/((?:19|20)\d{2})\. \d{1,2}\. \d{1,2}\./g);return mm?+mm[mm.length-1].slice(0,4):null;})();
        const w=y?dow(y,mo,d):"";
        if(dw)r+="("+(w||dwc)+")";
        else if(opts.week&&ctx==="body"&&w&&str[offset+m.length]!==")")r+="("+w+")";
        if(r!==m)add("날짜 형식 (예: 2026. 3. 4.)");
        return r;
      });
    // 시간
    o=o.replace(/(오전|오후|낮|밤|저녁|아침)?\s*(?<![\d.:])(\d{1,2})\s*시\s*(?:(\d{1,2})\s*분|(반))?(?![간대작행험설청립의장])/g,(m,ap,h,mi,half)=>{
      h=+h;mi=half?30:(mi?+mi:0);
      if(ap==="오후"||ap==="저녁"||ap==="밤"){if(h<12)h+=12;}
      if(ap==="오전"||ap==="아침"){if(h===12)h=0;}
      if(h>24||mi>59)return m;
      add("시간 24시간제 (예: 15:30)");
      const lead=m.match(/^\s*/)[0];
      return (ap?"":lead)+String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0");
    });
    o=o.replace(/(?<![\d.:])(\d):(\d{2})(?!\d)/g,(m,h,mi)=>{add("시간 24시간제 (예: 15:30)");return "0"+h+":"+mi;});
    // 쌍점
    o=o.replace(/([가-힣A-Za-z)\]」])[ \t]*:(?!\/)[ \t]*(?=\S)/g,(m,a)=>{const r=a+": ";if(r!==m)add("쌍점(:) 띄어쓰기");return r;});
    // 문서번호 하이픈

/* ---------- 본문 해석 ---------- */
const MARK_RE=[
  [/^\d+\.\s+/,1],[/^\d+\.(?=\S)(?![\d])/,1],[/^[가-힣]\.\s*/,2],[/^\d+\)\s*/,3],[/^[가-힣]\)\s*/,4],
  [/^\(\d+\)\s*/,5],[/^\([가-힣]\)\s*/,6],[/^[①-⑳]\s*/,7],[/^[㉮-㉻]\s*/,8]
];
const AUX_RE=/^([-–·•○◦∘ｏ※*□■▶◎])\s*/;
function parseBody(text,base,removed){
  const raw=text.replace(/\r/g,"").split("\n");
  const items=[];
  let minMark=99;
  const pre=raw.map(l=>{
    const lead=(l.match(/^[ \t　]*/)||[""])[0];
    const sp=[...lead].reduce((a,c)=>a+(c==="\t"?2:c==="　"?2:1),0);
    let s=l.slice(lead.length).replace(/\s+$/,"");
    let mk=0;
    if(!/^\|/.test(s)){for(const [re,lv] of MARK_RE){if(!re.test(s))continue;if((lv===2||lv===4)&&!/^[가-힣][.)](\s|$)/.test(s))continue;mk=lv;s=s.replace(re,"");break;}}
    if(mk)minMark=Math.min(minMark,mk);
    return {sp,s,mk};
  });
  let lastLevel=base-1,tableBuf=null;
  for(const p of pre){
    if(!p.s){continue;}
    if(/^[-–]\s*(다\s*음|아\s*래)\s*[-–]$/.test(p.s)){removed.push("‘- 다 음 -’ 줄 삭제");continue;}
    if(/^\|/.test(p.s)){
      const cells=p.s.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      if(cells.every(c=>/^:?-{2,}:?$/.test(c)))continue;
      if(!tableBuf){tableBuf={kind:"table",level:Math.max(base,lastLevel+1),rows:[]};items.push(tableBuf);}
      tableBuf.rows.push(cells);continue;
    }
    tableBuf=null;
    const am=p.s.match(AUX_RE);
    let level;
    if(p.mk)level=base+(p.mk-minMark);
    else level=base+Math.floor(p.sp/2);
    if(am&&!p.mk){
      const lv=p.sp>0?Math.max(base+Math.floor(p.sp/2),lastLevel+1):lastLevel+1;
      items.push({kind:"aux",level:Math.max(lv,base),sym:am[1],text:p.s.slice(am[0].length)});
      continue;
    }
    items.push({kind:"item",level,text:p.s,children:[]});
    lastLevel=level;
  }
  return items;
}
// 평평한 목록 → 트리
function toTree(flat,base){
  const root={level:base-1,children:[]};const stack=[root];
  for(const it of flat){
    const node=Object.assign({children:[]},it);
    while(stack.length>1&&stack[stack.length-1].level>=node.level)stack.pop();
    // 단계 건너뛰기 방지
    const parent=stack[stack.length-1];
    if(node.level>parent.level+1&&node.kind==="item")node.level=parent.level+1;
    parent.children.push(node);
    if(node.kind==="item")stack.push(node);
  }
  return root.children;
}
// 트리 → 줄 목록 {type:'line',indent(em),marker,text} / table /
function flatten(nodes,level,opts,out){
  const numbered=nodes.filter(n=>n.kind==="item");
  const single=opts.single&&numbered.length===1;
  let n=0;
  for(const node of nodes){
    if(node.kind==="table"){out.push({type:"table",indent:Math.max(0,level-1)*1+(level>1?0:0),rows:node.rows});continue;}
    if(node.kind==="aux"){out.push({type:"line",indent:(level-1),marker:node.sym,text:node.text});continue;}
    n++;
    if(single&&level===1&&node.children.some(c=>c.kind==="item")){
      // 한 문장 도입문: 번호 없이, 하위 항목을 1단계로 올림
      out.push({type:"line",indent:0,marker:"",text:node.text});
      flatten(node.children,1,opts,out);continue;
    }
    out.push({type:"line",indent:(level-1),marker:single?"":marker(level,n),text:node.text});
    if(node.children.length)flatten(node.children,level+1,opts,out);
  }
}

// 사용자 규칙: 학교 내부결재 — 보고 문서는 "보고합니다.", 추진 계획(안)은 "수립하여 추진하고자 합니다." / 교육청에 보내는 보고는 "제출합니다."

function stemOf(title,type){

  const T=TYPES[type];

function readForm(){

function buildModel(v){
  const fx=makeFixer({fix:v.optFix,week:v.optWeek});
  const removed=[];
  const F=(s,c)=>fx.fix(s,c);
  const type=v.docType,T=TYPES[type];
  const title=F(v.title.trim(),"title");
  const rel=v.related.split("\n").map(s=>s.trim().replace(/^(\d+\.|[가-힣]\.|-)\s*/,"").replace(/^관련\s*:?\s*/,"")).filter(Boolean).map(s=>F(s,"rel"));
  let bodyText=v.body.replace(/(?<=[.\s])\s*끝\s*\.?\s*$/,()=>{removed.push("직접 쓴 ‘끝.’ 정리 (자동으로 붙입니다)");return "";});
  const att=v.attach.split("\n").map(s=>s.trim()).filter(Boolean).map(s=>{
    s=s.replace(/^(붙임\s*)?(\d+\.|[-·•])\s*/,"").replace(/^붙임\s*/,"").replace(/\s*끝\s*\.?$/,"");
    s=F(s,"att");
    if(/\d+\s*부\.?\s*(\([^)]*\))?\.?$/.test(s))s=s.replace(/(\d+)\s*부\.?\s*(\([^)]*\))?\.?$/,(m,n,p)=>n+"부."+(p||""));
    else s=s.replace(/\.$/,"")+" 1부.";
    return s;
  });
  const hasAtt=att.length>0;
  const fixedBody=bodyText.split("\n").map(l=>{const lead=l.match(/^[ \t　]*/)[0];return lead+F(l.slice(lead.length),"body");}).join("\n");
  const free=type==="free";
  const top=[];
  if(rel.length===1)top.push({kind:"item",level:1,text:"관련: "+rel[0]});
  else if(rel.length>1){top.push({kind:"item",level:1,text:"관련"});rel.forEach(r=>top.push({kind:"item",level:2,text:r}));}
  const detail=parseBody(fixedBody,free?1:2,removed);
  let leadText="";
  if(!free){
    leadText=v.lead.trim()?F(v.lead.trim(),"body"):T.lead(stemOf(title||"○○",type),detail.length>0,hasAtt,v.closing,v);
    top.push({kind:"item",level:1,text:leadText});
  }
  const tree=toTree(top.concat(detail),1);
  const lines=[];flatten(tree,1,{single:v.optSingle},lines);
  const box=F(v.box.trim(),"body");
  // 수신·발신
  const internal=v.recvType==="internal";
  const recvLabel=internal?"내부결재":v.recvType==="ref"?"수신자 참조":(v.recv.trim()||"○○○");
  const model={
    slogan:v.slogan.trim(),org:v.org.trim(),logoL:logos.L,logoR:logos.R,recv:recvLabel,via:v.via.trim(),title:title||"(제목)",
    lines,box,att,
    sender:internal?"":v.sender.trim(),recvList:v.recvType==="ref"?v.recvList.trim():"",showRecvList:v.recvType==="ref",
    leadAuto:free||v.lead.trim()?"":leadText
  };
  // 끝 표시 위치
  if(att.length){model.endOn="att";}
  else if(box){model.endOn="afterBox";}
  else{
    const last=lines[lines.length-1];
    if(!last)model.endOn="none";
    else if(last.type==="table")model.endOn="afterTable";
    else{model.endOn="line";last.text=last.text.replace(/\s*끝\s*\.?$/,"");}
  }
  const allText=[title,...rel,...lines.map(l=>l.text||""),box,...att].join("\n");
  model.fixLog=fx.log;model.removed=removed;model.warn=warnings(allText);
  if(!v.title.trim())model.warn.unshift("제목을 입력하세요.");
  if(!rel.length&&!free)model.warn.push("‘1. 관련’이 비어 있습니다. 학교교육계획에 있는 업무면 ‘2026학년도 학교교육계획’을 쓰세요.");
  return model;
}
